[project]
name = "moodtrack"
version = "0.1.0"
description = "Plataforma de acompanhamento contínuo da saúde mental para psicólogos e pacientes."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Gabriel Losekann" },
]
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg[binary]>=3.2,<4",
    "django-allauth[socialaccount]>=65,<66",
    "django-environ>=0.11,<0.12",
    "django-cryptography-5>=2.0,<3",
    "anthropic>=0.40,<1",
    "spacy>=3.8,<4",
    "stripe>=11,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<0.7",
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "factory-boy>=3.3,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = ["--tb=short", "-ra"]
markers = [
    "slow: testes lentos (carregam modelo spaCy ou similar)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # gerenciado por formatter
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405", "F403"]
"tests/**/*.py" = ["B011"]
# Django Meta classes usam constraints/indexes/permissions/widgets/labels — convenção do framework.
"apps/**/models.py" = ["RUF012"]
"apps/**/forms.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
